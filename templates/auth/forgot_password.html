{% extends "base.html" %}

{% block title %}Reset Password — Linux Commands Learning Assistant{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-header">
        <div style="width: 48px; height: 48px; border-radius: 12px; background: rgba(245, 158, 11, 0.15); color: #fbbf24; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 0.75rem;">
            <i class="fas fa-key"></i>
        </div>
        <h2>Reset Your Password</h2>
        <p>Enter your account email and choose a new password</p>
    </div>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
        <div class="form-group">
            <label for="email"><i class="fas fa-envelope"></i> Account Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="user@gmail.com" value="{{ email or '' }}" required autofocus>
        </div>

        <div class="form-group">
            <label for="new_password"><i class="fas fa-lock"></i> New Password</label>
            <input type="password" id="new_password" name="new_password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
        </div>

        <div class="form-group">
            <label for="confirm_password"><i class="fas fa-check-double"></i> Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter new password" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
            <i class="fas fa-sync-alt"></i> Update Password
        </button>
    </form>

    <div class="auth-footer">
        Remembered your password? <a href="{{ url_for('auth.login') }}">Return to Login</a>
    </div>
</div>
{% endblock %}
